{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Register" %}{% endblock %}

{% block content %}
<section class="dashboard-section">
    <div class="container" style="max-width:500px;">
        <div class="dashboard-panel d-block mt-5">
            <h2 class="text-center fw-bold mb-4" style="color:#0d1b4d;">
                {% trans "Create New Account" %}
            </h2>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <input type="text" name="first_name" class="form-control" placeholder="{% trans 'First Name' %}" required>
                </div>

                <div class="mb-3">
                    <input type="email" name="email" class="form-control" placeholder="{% trans 'Email' %}" required>
                </div>

                <div class="mb-3">
                    <input type="password" name="password" class="form-control" placeholder="{% trans 'Password' %}" required>
                </div>

                <div class="mb-4">
                    <input type="password" name="confirm_password" class="form-control" placeholder="{% trans 'Confirm Password' %}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">{% trans "Register As" %}</label>
                    <select name="role" class="form-control">
                        <option value="student">{% trans "Student" %}</option>
                        <option value="agency">{% trans "Volunteer Organization" %}</option>
                    </select>
                </div>

                <button type="submit" class="dashboard-btn w-100">
                    {% trans "Register" %}
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}

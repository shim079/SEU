{% extends "base.html" %}
{% load static %}

{% block title %}Register{% endblock %}

{% block content %}
<section class="dashboard-section">
    <div class="container" style="max-width:600px;">
        <div class="dashboard-panel d-block mt-5">
            <h2 class="mb-4 text-center fw-bold" style="color:#0d1b4d;">Create Account</h2>

            <form method="POST">
                {% csrf_token %}

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" name="first_name" class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" name="last_name" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">University ID</label>
                    <input type="text" name="university_id" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Register As</label>
                    <select name="role" class="form-control">
                        <option value="student">Student</option>
                        <option value="agency">Volunteer Organization</option>
                    </select>
                </div>

                <button type="submit" class="dashboard-btn w-100">
                    Create Account
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'login' %}">
                    Already have an account? Login
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}

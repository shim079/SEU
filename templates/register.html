{% extends "base.html" %}
{% load i18n %}
{% load static %}

{% block title %}{% trans "Register" %}{% endblock %}

{% block content %}
<section class="dashboard-section">
    <div class="container" style="max-width:600px;">
        <div class="dashboard-panel d-block mt-5">
            <h2 class="mb-4 text-center fw-bold" style="color:#0d1b4d;">{% trans "Create Account" %}</h2>

            <form method="POST">
                {% csrf_token %}

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">{% trans "First Name" %}</label>
                        <input type="text" name="first_name" class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">{% trans "Last Name" %}</label>
                        <input type="text" name="last_name" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">{% trans "Email" %}</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">{% trans "University ID" %}</label>
                    <input type="text" name="university_id" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">{% trans "Password" %}</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">{% trans "Confirm Password" %}</label>
                    <input type="password" name="confirm_password" class="form-control" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">{% trans "Register As" %}</label>
                    <select name="role" class="form-control">
                        <option value="student">{% trans "Student" %}</option>
                        <option value="agency">{% trans "Volunteer Organization" %}</option>
                    </select>
                </div>

                <button type="submit" class="dashboard-btn w-100">
                    {% trans "Create Account" %}
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'login' %}">
                    {% trans "Already have an account? Login" %}
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Add Opportunity" %}{% endblock %}

{% block content %}
<section class="dashboard-hero">
    <div class="container text-center">
        <h1>{% trans "Add Opportunity" %}</h1>
        <p>{% trans "Use the form below to create a new volunteer opportunity." %}</p>
    </div>
</section>

<section class="dashboard-section">
    <div class="container" style="max-width:650px;">
        <div class="dashboard-panel">
            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">{% trans "Title" %}</label>
                    <input type="text" name="title" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">{% trans "Category" %}</label>
                    <select name="category" class="form-control" required>
                        <option value="">{% trans "Select Category" %}</option>
                        <option value="Computer Science">{% trans "Computer Science" %}</option>
                        <option value="Business">{% trans "Business" %}</option>
                        <option value="Engineering">{% trans "Engineering" %}</option>
                        <option value="Healthcare">{% trans "Healthcare" %}</option>
                        <option value="Education">{% trans "Education" %}</option>
                        <option value="Media">{% trans "Media" %}</option>
                        <option value="Artificial Intelligence">{% trans "Artificial Intelligence" %}</option>
                        <option value="Cybersecurity">{% trans "Cybersecurity" %}</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">{% trans "Description" %}</label>
                    <textarea name="description" class="form-control" rows="4" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">{% trans "Date" %}</label>
                    <input type="date" name="date" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">{% trans "Location" %}</label>
                    <input type="text" name="location" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">{% trans "Volunteer Hours" %}</label>
                    <input type="number" name="hours" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">{% trans "Organization" %}</label>
                    <input type="text" name="organization" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">{% trans "Application Deadline" %}</label>
                    <input type="datetime-local" name="application_deadline" class="form-control" required>
                </div>

                <div class="d-flex gap-3 mb-5">

                <button type="submit" class="mt-3 btn btn-primary w-100">{% trans "Add Opportunity" %}</button>
               
                <a href="{% url 'dashboard:agency_dashboard' %}" class="mt-3 btn btn-secondary">
                {% trans "Cancle" %}
            </a>
        </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}

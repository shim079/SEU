{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Edit Opportunity" %}{% endblock %}

{% block extra_css %}
<style>
    .opportunity-nav {
        background-color: #f8f9fa;
        padding: 15px 0;
        margin-bottom: 20px;
    }
</style>
{% endblock %}

{% block content %}
<div class="opportunity-nav">
    <div class="container">
        <a href="{% url 'opportunities:opportunity_list' %}" class="mt-4 btn btn-secondary">{% trans "All Opportunities" %}</a>
    </div>
</div>

<div class="container mt-5 mb-5">
    <h2 class="fw-bold mb-4">{% trans "Edit Opportunity" %}</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">{% trans "Title" %}</label>
            <input type="text" name="name" class="form-control"
                   value="{{ opportunity.name }}" required>
        </div>
        <div class="mb-3">
    <label class="form-label">
        {% trans "Category" %}
    </label>

    <select name="category" class="form-control" required>

        <option value="">
            {% trans "Select Category" %}
        </option>

        <option value="Computer Science"
            {% if opportunity.category == "Computer Science" %}selected{% endif %}>
            {% trans "Computer Science" %}
        </option>

        <option value="Business"
            {% if opportunity.category == "Business" %}selected{% endif %}>
            {% trans "Business" %}
        </option>

        <option value="Engineering"
            {% if opportunity.category == "Engineering" %}selected{% endif %}>
            {% trans "Engineering" %}
        </option>

        <option value="Healthcare"
            {% if opportunity.category == "Healthcare" %}selected{% endif %}>
            {% trans "Healthcare" %}
        </option>

        <option value="Education"
            {% if opportunity.category == "Education" %}selected{% endif %}>
            {% trans "Education" %}
        </option>

        <option value="Media"
            {% if opportunity.category == "Media" %}selected{% endif %}>
            {% trans "Media" %}
        </option>

        <option value="Artificial Intelligence"
            {% if opportunity.category == "Artificial Intelligence" %}selected{% endif %}>
            {% trans "Artificial Intelligence" %}
        </option>

        <option value="Cybersecurity"
            {% if opportunity.category == "Cybersecurity" %}selected{% endif %}>
            {% trans "Cybersecurity" %}
        </option>

    </select>
</div>

        <div class="mb-3">
            <label class="form-label">{% trans "Description" %}</label>
            <textarea name="description" class="form-control" rows="4" required>{{ opportunity.description }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">{% trans "Location" %}</label>
            <input type="text" name="location" class="form-control"
                   value="{{ opportunity.location }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">{% trans "Date" %}</label>
            <input type="date" name="date" class="form-control"
                   value="{{ opportunity.date|date:'Y-m-d' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">{% trans "Hours" %}</label>
            <input type="number" name="hours" class="form-control"
                   value="{{ opportunity.hours }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">{% trans "Organization" %}</label>
            <input type="text" name="organization" class="form-control"
                   value="{{ opportunity.organization }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">{% trans "Application Deadline" %}</label>
            <input type="datetime-local" name="application_deadline" class="form-control"
                   value="{{ opportunity.application_deadline|date:'Y-m-d\TH:i' }}" required>
        </div>

        <button type="submit" class="mt-3 btn dashboard-btn">
            {% trans "Save Changes" %}
        </button>

        <a href="{% url 'dashboard:agency_dashboard' %}" class="mt-3 btn btn-secondary ms-2">
            {% trans "Cancel" %}
        </a>
    </form>
</div>

{% endblock %}

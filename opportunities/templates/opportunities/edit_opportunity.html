{% extends 'opportunities/base.html' %}
{% load i18n %}

{% block title %}{% trans "Edit Opportunity" %}{% endblock %}

{% block opportunity_content %}

<div class="container mt-5">
    <h2>{% trans "Edit Opportunity" %}</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>{% trans "Name" %}</label>
            <input type="text" name="name" class="form-control"
                   value="{{ opportunity.name }}" required>
        </div>

        <div class="mb-3">
            <label>{% trans "Description" %}</label>
            <textarea name="description" class="form-control" required>{{ opportunity.description }}</textarea>
        </div>

        <div class="mb-3">
            <label>{% trans "Location" %}</label>
            <input type="text" name="location" class="form-control"
                   value="{{ opportunity.location }}" required>
        </div>

        <div class="mb-3">
            <label>{% trans "Date" %}</label>
            <input type="date" name="date" class="form-control"
                   value="{{ opportunity.date|date:'Y-m-d' }}" required>
        </div>

        <div class="mb-3">
            <label>{% trans "Hours" %}</label>
            <input type="number" name="hours" class="form-control"
                   value="{{ opportunity.hours }}" required>
        </div>

        <div class="mb-3">
            <label>{% trans "Organization" %}</label>
            <input type="text" name="organization" class="form-control"
                   value="{{ opportunity.organization }}" required>
        </div>

        <button type="submit" class="btn btn-primary">
            {% trans "Save Changes" %}
        </button>

        <a href="{% url 'dashboard:agency_dashboard' %}" class="btn btn-secondary">
            {% trans "Cancel" %}
        </a>
    </form>
</div>

{% endblock opportunity_content %}
